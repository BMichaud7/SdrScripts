# OpenRFStack Recon Node Configuration
# Passive collection only — no on-device classification. Captures raw IQ
# for any signal crossing the SNR threshold, GPS-tags it, and writes it to
# disk for later identification on a more capable machine.

# ── SDR Services ─────────────────────────────────────────────────────────────
ENABLE_SDR_CONTROLLER=true    # SdrResourceManager — task & device management
ENABLE_SDR_ACQUISITION=true   # AcquisitionApp     — RF capture / detection
ENABLE_SDR_ANALYSIS=false     # AnalysisApp        — disabled (no on-device ID)
ENABLE_SDR_DEMOD=false        # DemodApp           — disabled (no on-device ID)
ENABLE_SDR_SPEECH=false       # SpeechApp          — disabled (requires GPU/Whisper)
ENABLE_SDR_GPS=true           # GpsApp             — GPS location logger
ENABLE_SDR_RECON=true         # sdr_recon.py       — IQ capture-on-detection recorder

# ── GitHub Repos (for RPM downloads) ─────────────────────────────────────────
REPO_SDR_CONTROLLER=OpenRFStack/SdrResourceManager
REPO_SDR_ACQUISITION=OpenRFStack/AcquisitionApp
REPO_SDR_ANALYSIS=OpenRFStack/AnalysisApp
REPO_SDR_DEMOD=OpenRFStack/DemodApp
REPO_SDR_SPEECH=OpenRFStack/SpeechApp
REPO_SDR_GPS=OpenRFStack/GpsApp

RELEASE_TAG=latest-main

# ── GPS ───────────────────────────────────────────────────────────────────────
# Mount a serial GPS or USB GPS dongle into the container, e.g.:
#   -v /dev/ttyACM0:/dev/ttyACM0
# gpsd runs inside this container against GPS_SERIAL_DEVICE
# (default /dev/ttyACM0; set GPS_SERIAL_DEVICE to override, e.g. /dev/ttyUSB0).

# ── Recon capture tuning ──────────────────────────────────────────────────────
# Minimum SNR (dB) to trigger a capture. Lower = more false-positive captures.
RECON_SNR_MIN=15
# How long to record per capture (seconds). Longer captures give later
# classifiers (AnalysisApp on a real PC) more signal to work with at the
# cost of disk space and missing the next detection during the capture.
RECON_CAPTURE_S=10
# RX gain for capture tasks (dB). 40 suits RTL-SDR at VHF/UHF.
RECON_GAIN=40
# Minimum seconds before re-capturing the same frequency bin.
RECON_COOLDOWN=60
# Output format: cf32 (numpy-compatible raw IQ, default), npz, or wav.
RECON_FORMAT=cf32
# Where captures land inside the container — mount this to a USB drive or
# NFS share for long unattended deployments, e.g. -v /mnt/usb:/var/lib/sdr/recon
RECON_OUT=/var/lib/sdr/recon
