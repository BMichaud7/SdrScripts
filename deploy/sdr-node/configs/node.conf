# OpenRFStack Node Configuration
# Controls which services are pulled from GitHub Releases and started via k3s.
# Comment out any service to skip its RPM install and k8s deployment.

# ── Infrastructure (always started) ──────────────────────────────────────────
# artemis and postgres are always required; they cannot be disabled here.

# ── SDR Services ─────────────────────────────────────────────────────────────
# Format: SERVICE_ENABLED=true|false
#   true  — RPM downloaded on first start; k8s manifest applied
#   false — skipped entirely

ENABLE_SDR_CONTROLLER=true    # SdrResourceManager  (device management)
ENABLE_SDR_ACQUISITION=true   # AcquisitionApp       (RF capture)
ENABLE_SDR_ANALYSIS=true      # AnalysisApp          (signal classification)
ENABLE_SDR_DEMOD=true         # DemodApp             (demodulation)       config: /etc/sdr-demod/demod.xml
ENABLE_SDR_SPEECH=true        # SpeechApp            (speech transcription) config: /etc/sdr-speech/speech.xml

# ── GitHub Repos (for RPM downloads) ─────────────────────────────────────────
# Override if you fork any repo under a different org.
REPO_SDR_CONTROLLER=OpenRFStack/SdrResourceManager
REPO_SDR_ACQUISITION=OpenRFStack/AcquisitionApp
REPO_SDR_ANALYSIS=OpenRFStack/AnalysisApp
REPO_SDR_DEMOD=OpenRFStack/DemodApp
REPO_SDR_SPEECH=OpenRFStack/SpeechApp

# ── Release tag to pull RPMs from ────────────────────────────────────────────
# Use "latest-main" for the rolling latest, or pin to a specific tag e.g. "v1.5.0"
RELEASE_TAG=latest-main

# ── Whisper speech model (optional) ──────────────────────────────────────────
# Set to auto-download on first start. Options: tiny.en base.en small.en medium.en
# Leave empty to disable auto-download (mount model manually instead).
# WHISPER_MODEL=base.en
