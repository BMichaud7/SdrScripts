---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdr-acquisition
  namespace: sdr-system
  labels:
    app: sdr-acquisition
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdr-acquisition
  template:
    metadata:
      labels:
        app: sdr-acquisition
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 0
      containers:
        - name: sdr-acquisition
          image: docker.io/rockylinux:9-minimal
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/sdr_acquisition"]
          args: ["--config", "/etc/sdr/scanner.xml"]
          env:
            - name: SDR_LOG_LEVEL
              value: info
            - name: LD_LIBRARY_PATH
              value: /opt/sdr/lib64
          volumeMounts:
            - name: sdr-bin
              mountPath: /usr/bin/sdr_acquisition
            - name: sdr-lib64
              mountPath: /opt/sdr/lib64
            - name: sdr-etc
              mountPath: /etc/sdr
            - name: sdr-cache
              mountPath: /var/cache/sdr-acquisition
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
      volumes:
        - name: sdr-bin
          hostPath:
            path: /usr/bin/sdr_acquisition
            type: File
        - name: sdr-lib64
          hostPath:
            path: /usr/lib64
            type: Directory
        - name: sdr-etc
          hostPath:
            path: /etc/sdr
            type: Directory
        - name: sdr-cache
          hostPath:
            path: /var/lib/sdr/acq-cache
            type: DirectoryOrCreate
