---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdr-analysis
  namespace: sdr-system
  labels:
    app: sdr-analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdr-analysis
  template:
    metadata:
      labels:
        app: sdr-analysis
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 0
      containers:
        - name: sdr-analysis
          image: docker.io/rockylinux:9-minimal
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/sdr_analysis"]
          args: ["--config", "/etc/sdr/analysis.xml"]
          env:
            - name: SDR_LOG_LEVEL
              value: info
            - name: SDR_CONFIG_PATH
              value: /etc/sdr/analysis.xml
            - name: LD_LIBRARY_PATH
              value: /opt/sdr/lib64
          volumeMounts:
            - name: sdr-bin
              mountPath: /usr/bin/sdr_analysis
            - name: sdr-lib64
              mountPath: /opt/sdr/lib64
            - name: sdr-etc
              mountPath: /etc/sdr
            # Optional: mount ONNX model dir if present
            # -v /path/to/models:/models:ro,z on the Podman run command
            - name: sdr-models
              mountPath: /models
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
      volumes:
        - name: sdr-bin
          hostPath:
            path: /usr/bin/sdr_analysis
            type: File
        - name: sdr-lib64
          hostPath:
            path: /usr/lib64
            type: Directory
        - name: sdr-etc
          hostPath:
            path: /etc/sdr
            type: Directory
        - name: sdr-models
          hostPath:
            path: /var/lib/sdr/models
            type: DirectoryOrCreate
