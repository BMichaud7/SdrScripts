# OpenRFStack Mobile Node Configuration
# Optimised for low-compute environments (drones, embedded ARM boards).
# Only the lightweight acquisition pipeline is enabled; analysis and
# speech transcription are disabled.

# ── SDR Services ─────────────────────────────────────────────────────────────
ENABLE_SDR_CONTROLLER=true    # SdrResourceManager — task & device management
ENABLE_SDR_ACQUISITION=true   # AcquisitionApp     — RF capture
ENABLE_SDR_ANALYSIS=false     # AnalysisApp        — disabled (CPU-heavy)
ENABLE_SDR_DEMOD=false        # DemodApp           — disabled (CPU-heavy)
ENABLE_SDR_SPEECH=false       # SpeechApp          — disabled (requires GPU/Whisper)
ENABLE_SDR_GPS=true           # GpsApp             — GPS location logger

# ── GitHub Repos (for RPM downloads) ─────────────────────────────────────────
REPO_SDR_CONTROLLER=OpenRFStack/SdrResourceManager
REPO_SDR_ACQUISITION=OpenRFStack/AcquisitionApp
REPO_SDR_ANALYSIS=OpenRFStack/AnalysisApp
REPO_SDR_DEMOD=OpenRFStack/DemodApp
REPO_SDR_SPEECH=OpenRFStack/SpeechApp
REPO_SDR_GPS=OpenRFStack/GpsApp

RELEASE_TAG=latest-main

# ── GPS ───────────────────────────────────────────────────────────────────────
# Mount a serial GPS or use a USB GPS dongle with gpsd on the host.
# Pass --device /dev/ttyUSB0 (or --device /dev/ttyACM0) to the container
# and ensure gpsd is running on the host (or inside this container via
# -v /run/gpsd.sock:/run/gpsd.sock:z).
