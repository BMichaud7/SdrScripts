name: Container

on:
  push:
    branches: ["main/1.0"]
    paths:
      - "deploy/sdr-node/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sdr-node/Containerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/openrfstack/openrfstack-node:${{ github.sha }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

  merge:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/openrfstack/openrfstack-node:latest \
            --tag ghcr.io/openrfstack/openrfstack-node:${{ github.sha }} \
            ghcr.io/openrfstack/openrfstack-node:${{ github.sha }}-amd64 \
            ghcr.io/openrfstack/openrfstack-node:${{ github.sha }}-arm64

      - name: Make package public
        run: |
          gh api -X PATCH /orgs/openrfstack/packages/container/openrfstack-node \
            -f visibility=public 2>/dev/null || \
          echo "Note: set package visibility to Public manually at https://github.com/orgs/OpenRFStack/packages"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
