name: Mobile Container

on:
  push:
    branches: ["main/1.0"]
    paths:
      - "deploy/mobile-node/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.variant }} ${{ matrix.target.platform }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant: [default, lite]
        target:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/mobile-node/Containerfile
          platforms: ${{ matrix.target.platform }}
          build-args: |
            K3S_LITE=${{ matrix.variant == 'lite' && 'true' || 'false' }}
          push: true
          tags: ghcr.io/openrfstack/openrfstack-mobile${{ matrix.variant == 'lite' && '-lite' || '' }}:${{ github.sha }}-${{ matrix.target.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-from: type=gha,scope=mobile-${{ matrix.variant }}-${{ matrix.target.platform }}
          cache-to: type=gha,scope=mobile-${{ matrix.variant }}-${{ matrix.target.platform }},mode=max

  merge:
    name: Create multi-arch manifest (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        variant: [default, lite]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          PKG="openrfstack-mobile${{ matrix.variant == 'lite' && '-lite' || '' }}"
          docker buildx imagetools create \
            --tag "ghcr.io/openrfstack/${PKG}:latest" \
            --tag "ghcr.io/openrfstack/${PKG}:${{ github.sha }}" \
            "ghcr.io/openrfstack/${PKG}:${{ github.sha }}-amd64" \
            "ghcr.io/openrfstack/${PKG}:${{ github.sha }}-arm64"

      - name: Make package public
        run: |
          PKG="openrfstack-mobile${{ matrix.variant == 'lite' && '-lite' || '' }}"
          gh api -X PATCH "/orgs/openrfstack/packages/container/${PKG}" \
            -f visibility=public 2>/dev/null || \
          echo "Note: set package visibility to Public manually at https://github.com/orgs/OpenRFStack/packages"
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
