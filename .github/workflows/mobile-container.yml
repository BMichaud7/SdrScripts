name: Mobile Container

on:
  push:
    branches: ["main/1.0"]
    paths:
      - "deploy/mobile-node/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/mobile-node/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/openrfstack/openrfstack-mobile:latest
            ghcr.io/openrfstack/openrfstack-mobile:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        run: |
          gh api -X PATCH /orgs/openrfstack/packages/container/openrfstack-mobile \
            -f visibility=public 2>/dev/null || \
          echo "Note: set package visibility to Public manually at https://github.com/orgs/OpenRFStack/packages"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
